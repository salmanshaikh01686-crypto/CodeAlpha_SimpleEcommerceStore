{% extends "base.html" %}
{% block title %}Register | ShopEasy{% endblock %}
{% block content %}
<div class="auth-card">
    <p class="eyebrow">CREATE ACCOUNT</p>
    <h1>Register</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button button-large" type="submit">Create Account</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
